name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      WATCHTOWER_PII_SALT: ci-salt-0123456789abcdef
      WATCHTOWER_ALLOW_DEMO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Установка зависимостей
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Проверка advisories заблокированных зависимостей
        run: npm audit --audit-level=high
      - name: Сборка интерфейса
        run: npm run build
      - name: Сборка allowlist-сайта
        run: npm run build:public-site
      - name: Установка Gitleaks
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.11'
          cache: false
      - name: Подготовка Gitleaks и изолированной копии рабочего дерева
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          mkdir -p "$RUNNER_TEMP/gitleaks-worktree"
          tar --exclude=.git --exclude=node_modules -cf - . | tar -xf - -C "$RUNNER_TEMP/gitleaks-worktree"
      - name: Gitleaks — рабочее дерево и production-бандлы (redacted)
        run: |
          report="$RUNNER_TEMP/gitleaks-dir.json"
          if "$HOME/go/bin/gitleaks" dir --redact --report-format json --report-path "$report" --exit-code 1 "$RUNNER_TEMP/gitleaks-worktree"; then
            exit 0
          fi
          jq -r '.[] | [.RuleID, .File, (.StartLine | tostring)] | @tsv' "$report" | while IFS=$'	' read -r rule file line; do
            echo "::error file=$file,line=$line,title=Gitleaks candidate::$rule matched; value redacted. Treat as compromised pending review."
          done
          exit 1
      - name: Gitleaks — полная Git-история (redacted)
        run: |
          report="$RUNNER_TEMP/gitleaks-git.json"
          if "$HOME/go/bin/gitleaks" git --redact --report-format json --report-path "$report" --exit-code 1 --log-opts="--all" .; then
            exit 0
          fi
          jq -r '.[] | [.RuleID, .File, (.StartLine | tostring)] | @tsv' "$report" | while IFS=$'	' read -r rule file line; do
            echo "::error file=$file,line=$line,title=Gitleaks history candidate::$rule matched; value redacted. Treat as compromised pending review."
          done
          exit 1
      - name: Загрузка TruffleHog
        run: docker pull ghcr.io/trufflesecurity/trufflehog:3.97.9
      - name: TruffleHog — рабочее дерево (детали кандидатов скрыты)
        run: |
          if ! docker run --rm -v "$RUNNER_TEMP/gitleaks-worktree:/scan:ro" ghcr.io/trufflesecurity/trufflehog:3.97.9 filesystem /scan --no-update --no-verification --fail >"$RUNNER_TEMP/trufflehog-filesystem.log" 2>&1; then
            echo '::error::TruffleHog found a filesystem candidate; result details are suppressed to avoid leaking values into logs.'
            exit 1
          fi
      - name: TruffleHog — полная Git-история (детали кандидатов скрыты)
        run: |
          if ! docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" ghcr.io/trufflesecurity/trufflehog:3.97.9 git file:///repo --no-update --no-verification --fail >"$RUNNER_TEMP/trufflehog-git.log" 2>&1; then
            echo '::error::TruffleHog found a Git-history candidate; result details are suppressed to avoid leaking values into logs.'
            exit 1
          fi
      - name: Unit-тесты
        run: npm run test:unit
      - name: Интеграционные проверки API
        run: npm run test:hardening
      - name: Приватность игровых идентификаторов
        run: npm run test:privacy
      - name: Read-only инвариант
        run: npm run test:readonly
      - name: Скрытые Unicode-инструкции в коде и аудиторских материалах
        run: npm run test:source-safety
      - name: Границы агентной безопасности (пункты 71–82 каталога угроз)
        run: npm run test:agent-safety
      - name: Защиты и coverage контрольных сценариев 94–130
        run: npm run test:threat-coverage
      - name: Согласованность документации и ENV
        run: npm run test:docs
      - name: DOM-проверка интерфейса (jsdom)
        run: npm run test:ui
      - name: Согласованность сайта и allowlist-сборки
        run: npm run test:site
      - name: Smoke-тест на живом сервере
        env:
          # Без токенов write-маршруты отдают 503, и смоук проверял бы не то поведение.
          WATCHTOWER_INGEST_TOKEN: ci-ingest-token
          WATCHTOWER_READ_TOKEN: ci-read-token
          WATCHTOWER_API_URL: http://127.0.0.1:8787
        run: |
          node server/index.js & echo $! > /tmp/watchtower.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health >/dev/null && break; sleep 1; done
          npm run test:smoke
          kill "$(cat /tmp/watchtower.pid)"
      - name: Нагрузочная проверка API (латентность и отсутствие ошибок)
        run: npm run test:load
      - name: Мутационная проверка (гейт устойчивости математики)
        run: npm run test:mutation

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Проверка сборки минимального образа
        run: docker build -t watchtower-os:ci .
      - name: Проверка состава образа
        run: |
          docker run --rm --entrypoint sh watchtower-os:ci -ec '
            test ! -e /app/scripts
            test ! -e /app/docs/OPERATIONS.md
            test ! -e /app/prompts/games-v3
            test -f /app/docs/ecosystem-target.spec.json
            test -f /app/prompts/arena/PROMPT_ARENA_ARES1.md
            test -f /app/dist/ios.html
          '
      - name: 'Проверка: образ запускается, API работает, внутренние файлы не раздаются'
        run: |
          CI_INGEST_TOKEN="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-ingest"
          CI_READ_TOKEN="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-read"
          CI_PII_SALT="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pii-salt-0123456789abcdef"
          AUTH_HEADER_NAME=Authorization:
          AUTH_SCHEME=Bearer
          docker run -d --name watchtower-ci -p 8787:8787 \
            -e NODE_ENV=production \
            -e "WATCHTOWER_INGEST_TOKEN=$CI_INGEST_TOKEN" \
            -e "WATCHTOWER_READ_TOKEN=$CI_READ_TOKEN" \
            -e "WATCHTOWER_PII_SALT=$CI_PII_SALT" \
            watchtower-os:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health >/dev/null && break; sleep 1; done
          curl -s http://127.0.0.1:8787/api/health | grep -q '\"writes\":false'
          curl -s -H "$AUTH_HEADER_NAME $AUTH_SCHEME $CI_READ_TOKEN" http://127.0.0.1:8787/api/games | grep -q '\"ares1\"'
          curl -s -H "$AUTH_HEADER_NAME $AUTH_SCHEME $CI_READ_TOKEN" http://127.0.0.1:8787/api/arena/prompts/ares1 | grep -q 'PROMPT_ARENA_ARES1.md'
          curl -sf -o /dev/null http://127.0.0.1:8787/
          for path in /README.md /Dockerfile /docs/OPERATIONS.md /prompts/games-v3/INDEX_V3.md /.env; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787$path")
            test "$code" = 404
          done
          curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/api/ingest/solana | grep -q 401
          docker rm -f watchtower-ci
      - name: 'Проверка: production отказывается стартовать без секретов'
        run: |
          set +e
          output=$(docker run --rm -e NODE_ENV=production watchtower-os:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -ne 0
          echo "$output" | grep -q "WATCHTOWER_INGEST_TOKEN"
